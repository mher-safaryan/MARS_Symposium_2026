baseURL = "https://mher-safaryan.github.io/MARS_Symposium_2026/"
languageCode = "en-gb"
title = "MARS Annual Symposium 2026"
theme = "blowfish"

enableRobotsTXT = true
enableEmoji = true

# Keep local navigation on the latest build, including after menu changes.
[[server.headers]]
  for = "/**"
  [server.headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

[markup]
  [markup.goldmark.renderer]
    unsafe = true

[params]
  colorScheme = "lancaster"
  description = "MARS Annual Symposium 2026: Computational Mathematics and Probabilistic Machine Learning"
  defaultAppearance = "light"
  autoSwitchAppearance = false
  enableSearch = false
  disableTextInHeader = false

  [params.Author]
    name = "MARS Annual Symposium 2026"
    headline = "Computational Mathematics and Probabilistic Machine Learning · Lancaster University · 9–11 September 2026"

  [params.homepage]
    layout = "custom"
    homepageImage = "images/background_photo_campus_highres.jpg"
    showRecent = false
    cardView = false

  [params.header]
    layout = "basic"

  [params.footer]
    showCopyright = false
    showThemeAttribution = false
    showAppearanceSwitcher = false
    showScrollToTop = true

[[menus.main]]
  name = "Programme"
  url = "/programme/"
  weight = 10
[[menus.main]]
  name = "Speakers"
  url = "/speakers/"
  weight = 15
# Registration period has ended; retain the menu entry for future use.
